# Render Blueprint for the StockPilot API (New -> Blueprint in the Render dashboard).
# Secrets are marked sync: false, so Render asks for their values instead of
# reading them from this file.
services:
  - type: web
    name: stockpilot-api
    runtime: python
    plan: free
    rootDir: stockpilot/backend
    buildCommand: pip install -r requirements.txt
    # Free instances have no pre-deploy step, so migrations run before startup
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: CORS_ORIGINS
        sync: false
